<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma mensagem para você</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f8, #fce1eb);
            color: #5e243b;
        }

        .mensagem {
            width: 90%;
            max-width: 550px;
            padding: 45px 30px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(125, 48, 79, 0.15);
        }

        .mensagem h1 {
            color: #c2185b;
            margin-bottom: 20px;
        }

        .mensagem p {
            font-size: 18px;
            line-height: 1.7;
        }

        .assinatura {
            color: #c2185b;
            font-weight: bold;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            background: #c85c82;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .voltar:hover {
            background: #a84468;
        }
    </style>
</head>

<body>

    <div class="mensagem">

        <h1>🌹 Uma mensagem para você</h1>

        <p>
            Que este espaço possa trazer um pouco de beleza,
            carinho e inspiração para o seu dia. 💕
        </p>

        <p>
            Obrigada por visitar a Bella Rosa!
        </p>

        <p>
            Beijos, com carinho
        </p>

        <p class="assinatura">
            Renata 💗
        </p>

        <a href="/" class="voltar">
            Voltar para o início
        </a>

    </div>

</body>
